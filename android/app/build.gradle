plugins {
    id 'com.android.application'
}

android {
    namespace 'com.supersys.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.supersys.app"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.3.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
