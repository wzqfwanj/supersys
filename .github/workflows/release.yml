name: release

# 打一个 v* 标签（或手动触发）就自动打包 Windows exe 并发布到 Releases
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.3

      - name: 打包 exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name supersys --icon web/icon.ico
          --add-data "web;web" --collect-submodules webview --hidden-import clr
          desktop.py

      - name: 检查产物
        run: |
          if (!(Test-Path dist/supersys.exe)) { throw "没有生成 dist/supersys.exe" }
          Get-Item dist/supersys.exe | Select-Object Name, Length

      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/supersys.exe
          --title "${{ github.ref_name }}"
          --generate-notes
          --repo "${{ github.repository }}"

      - name: 上传构建产物（手动触发时）
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: supersys-windows
          path: dist/supersys.exe
