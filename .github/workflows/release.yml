name: release

# 打一个 v* 标签（或手动触发）就自动打包 Windows exe + Android APK，并发布到 Releases
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Windows 桌面版 exe ----------
  exe:
    runs-on: windows-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.3

      - name: 注入云端地址（仓库变量，不写进代码）
        env:
          CLOUD_URL: ${{ vars.SUPERSYS_CLOUD_URL }}
        run: python tools/inject_cloud.py

      - name: 打包 exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name supersys --icon web/icon.ico
          --add-data "web;web" --collect-submodules webview --hidden-import clr
          desktop.py

      - name: 检查产物
        run: |
          if (!(Test-Path dist/supersys.exe)) { throw "没有生成 dist/supersys.exe" }
          Get-Item dist/supersys.exe | Select-Object Name, Length
          Copy-Item dist/supersys.exe dist/supersys-pc.exe

      - name: 上传 PC 版 exe
        uses: actions/upload-artifact@v4
        with:
          name: supersys-pc
          path: dist/supersys-pc.exe

  # ---------- Android 安装包 APK ----------
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 注入云端地址（仓库变量，不写进代码）
        env:
          CLOUD_URL: ${{ vars.SUPERSYS_CLOUD_URL }}
        run: python tools/inject_cloud.py

      - name: 恢复固定签名密钥（GitHub Secrets）
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少 ANDROID_KEYSTORE_BASE64 密钥" >&2
            exit 1
          fi
          mkdir -p android
          echo "$KEYSTORE_BASE64" | base64 -d > android/supersys.p12
          ls -l android/supersys.p12

      - name: 把网页资源打进 APK（本地存储模式要用）
        run: |
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/www
          cp -r web android/app/src/main/assets/www
          cp web/cloud.json android/app/src/main/assets/cloud.json

      - name: 打 APK（固定签名）
        env:
          SIGNING_KEYSTORE: ${{ github.workspace }}/android/supersys.p12
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../supersys.apk

      - name: 检查产物和签名
        run: |
          ls -lh supersys.apk
          unzip -l supersys.apk | grep -q "AndroidManifest.xml"
          unzip -l supersys.apk | grep -q "classes.dex"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs supersys.apk
          "$APKSIGNER" verify --print-certs supersys.apk | grep -qi "a58f951dca399d82903819a38fa4a46f40de90a39a11978d1a789385b52b6de7" \
            || (echo "签名证书指纹不对！" >&2; exit 1)
          cp supersys.apk supersys-mobile.apk

      - name: 上传移动端 APK
        uses: actions/upload-artifact@v4
        with:
          name: supersys-mobile
          path: supersys-mobile.apk

  # ---------- 发布 ----------
  release:
    needs: [exe, apk]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 取产物
        uses: actions/download-artifact@v4
        with:
          pattern: supersys-*
          merge-multiple: true
          path: dist

      - name: 列出产物
        run: ls -lh dist

      - name: 生成 SHA256 校验文件
        run: |
          cd dist
          sha256sum supersys-pc.exe supersys-mobile.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 发布到 Releases（PC 版 + 移动端）
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/supersys-pc.exe dist/supersys-mobile.apk dist/SHA256SUMS.txt
          --title "supersys ${{ github.ref_name }}（PC 版 + 移动端）"
          --notes "PC 版：supersys-pc.exe（Windows，未签名，SmartScreen 提示时选「更多信息 → 仍要运行」）；移动端：supersys-mobile.apk（Android）。两个客户端连同一个云端服务。校验文件：SHA256SUMS.txt。"
          --repo "${{ github.repository }}"
